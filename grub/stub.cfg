set default=0
set timeout=0

set gfxmode=1024x768x16
set gfxpayload=1024x768x16,1024x768

set default=MiniOS

clear

menuentry "Usb - Linux Grub Boot Menu" {
    echo Searching... /boot/grub/grub.cfg
search --no-floppy --set -f /boot/grub/grub.cfg

    echo Loading...
configfile /boot/grub/grub.cfg
}
menuentry "Usb - MiniOS Linux x864" --id=MiniOS {
    echo Searching... /minios/config.conf
search --no-floppy --set -f /minios/config.conf

    echo Loading...
set prefix=($root)/minios/boot/grub
source $prefix/x86_64-efi/grub.cfg
configfile /minios/boot/grub/grub.cfg
}