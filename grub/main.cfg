set default=0
set timeout=5

# Initialize gettext support
insmod regexp
insmod gettext
set localedir=$prefix/locale

# Build extra boot parameters (timezone and keyboard) only if set
set extra_params=""
if [ -n "$lang_timezone" ]; then
    set extra_params="timezone=$lang_timezone"
fi
if [ -n "$lang_keyboard" ]; then
    if [ -n "$extra_params" ]; then
        set extra_params="$extra_params keyboard-layouts=$lang_keyboard"
    else
        set extra_params="keyboard-layouts=$lang_keyboard"
    fi
fi

# Set GRUB language for gettext
if [ -n "$lang" ]; then
    set locale="$lang"
fi

# Gettext-based localized menu strings
set OS=$"MiniOS"
set resume=$"Resume previous session"
set newsession=$"Start a new session"
set choosesession=$"Choose session during startup"
set freshstart=$"Fresh Start"
set copyram=$"Copy to RAM"
set loading=$"Loading kernel and ramdisk..."
set choosesessiondisk=$"Choose session disk during startup"
set ZeR09=$"1Computer.PK Grub Boot Menu"

# Export variables for proper gettext functionality
export OS
export resume
export newsession
export choosesession
export freshstart
export copyram
export backtolang
export loading
export choosesessiondisk
export ZeR09

# Detect lockdown mode (Secure Boot) if not already set
if [ -z "$lockdown" ]; then
    set lockdown=n
    insmod font
    if ! loadfont $prefix/unicode.pf2 ; then
        set lockdown=y
    fi
fi

# Load fonts
if [ "$lockdown" = "y" ]; then
    loadfont (memdisk)/fonts/unicode.pf2
else
    loadfont $prefix/dejavu-bold-16.pf2
    loadfont $prefix/dejavu-bold-14.pf2
    loadfont $prefix/roboto-bold-20.pf2
    loadfont $prefix/roboto-regular-20.pf2
    loadfont $prefix/unicode.pf2
fi

if [ "$grub_platform" = "pc" ]; then
    set gfxmode=1024x768x32
    set gfxpayload=1024x768x32,1024x768
else
    set gfxmode=auto
    set gfxpayload=auto
fi

insmod all_video
insmod gfxterm
insmod png

set color_normal=light-gray/black
set color_highlight=white/black

# Set theme based on language
if [ -n "$lang" ]; then
    if [ -e /minios/boot/grub/minios-theme/theme_$lang.txt ]; then
        set theme=/minios/boot/grub/minios-theme/theme_$lang.txt
    elif [ -e /minios/boot/bootlogo791.png ]; then
        set theme=/minios/boot/grub/minios-theme/theme.txt
    else
        set color_normal=white/black
        set color_highlight=black/white
    fi
else
    if [ -e /minios/boot/bootlogo791.png ]; then
        set theme=/minios/boot/grub/minios-theme/theme.txt
    else
        set color_normal=white/black
        set color_highlight=black/white
    fi
fi

terminal_output gfxterm

menuentry "$resume" --class resume {
    echo $loading
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose nottyautologin perchdir=resume locales=$lang_utf $extra_params
    initrd /minios/boot/initrfs.img
}
menuentry "$newsession" --class new {
    echo $loading
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose nottyautologin perchdir=new locales=$lang_utf $extra_params
    initrd /minios/boot/initrfs.img
}
menuentry "$choosesession" --class switch {
    echo $loading
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose nottyautologin perchdir=ask locales=$lang_utf $extra_params
    initrd /minios/boot/initrfs.img
}
menuentry "$freshstart" --class live {
    echo $loading
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose nottyautologin locales=$lang_utf $extra_params
    initrd /minios/boot/initrfs.img
}
menuentry "$copyram" --class ram {
    echo $loading
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose nottyautologin toram locales=$lang_utf $extra_params
    initrd /minios/boot/initrfs.img
}
menuentry "$choosesessiondisk" --class switchdisk {
    echo $loading
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose nottyautologin perchdir=askdisk locales=$lang_utf $extra_params
    initrd /minios/boot/initrfs.img
}
menuentry "$ZeR09" --class ZeR09 {
    echo $loading
    set gfxpayload=$gfxpayload
    echo Searching... /minios/boot/grub/1compk.cfg
    search --no-floppy --set -f /minios/boot/grub/1compk.cfg

    echo Loading...
configfile /minios/boot/grub/1compk.cfg
}

